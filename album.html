<style>
body{background:#faf8f2!important}.wrap{width:min(1500px,100%)!important;margin:0 auto!important;padding:18px clamp(12px,3vw,42px)!important;box-sizing:border-box}
.album-only-bar{display:flex;justify-content:flex-end;margin:0 0 16px}.album-only-bar a{color:#0d5c57;text-decoration:none;font-weight:800;background:#fff;border:1px solid #c9ddd5;border-radius:999px;padding:10px 16px}
.page-top{padding-top:0!important;margin-top:0!important}.filters{margin-top:0!important}
</style></head>
<body>
<div class="wrap">

 <div class="album-only-bar"><a href="index.html">← На главную</a></div><section class="page-top">

</div>

 </section>
</div>
<script>
document.getElementById('filters').addEventListener('click',function(e){
 var b=e.target.closest('button'); if(!b) return;
 this.querySelectorAll('button').forEach(function(x){x.classList.remove('on')}); b.classList.add('on');
 var cat=b.dataset.cat;
 document.querySelectorAll('#gallery .g-item').forEach(function(it){
  it.style.display = (cat==='all' || it.dataset.cat===cat) ? '' : 'none';
 });
});
</script>

<script src="reveal.js"></script>
