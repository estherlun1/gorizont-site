<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Стереокартинки — Горизонт</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f6ef;color:#183d3b;font-family:Arial,sans-serif}.wrap{max-width:1400px;margin:auto;padding:20px clamp(14px,4vw,54px) 60px}.top{display:flex;justify-content:space-between;gap:12px;margin-bottom:25px}.top a{color:#0d5c57;text-decoration:none;font-weight:800;background:white;border:1px solid #d5e1da;border-radius:999px;padding:11px 17px}h1{color:#0d5c57;font-size:clamp(38px,5vw,66px);margin:0 0 12px;line-height:1}.lead{max-width:760px;line-height:1.65;font-size:17px;margin:0 0 30px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.tile{background:white;border-radius:22px;padding:14px;box-shadow:0 12px 34px #174a3710;display:flex;align-items:center;justify-content:center;min-height:260px;cursor:zoom-in;transition:transform .2s,box-shadow .2s}.tile:hover{transform:translateY(-4px);box-shadow:0 18px 42px #174a371b}.tile img{display:block;width:100%;height:clamp(230px,34vw,490px);object-fit:contain;border-radius:12px}.viewer{position:fixed;inset:0;z-index:10;background:#102d2be8;display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}.viewer.open{display:flex}.viewer img{max-width:95vw;max-height:92vh;object-fit:contain}.close{position:fixed;right:20px;top:15px;color:white;font-size:32px;background:none;border:0;cursor:pointer}@media(max-width:700px){.grid{grid-template-columns:1fr}.tile img{height:auto;max-height:70vh}.top{flex-wrap:wrap}}
</style></head><body><main class="wrap"><div class="top"><a href="index.html#games-section">← Все игры</a><a href="index.html">На главную</a></div><h1>Стереокартинки</h1><p class="lead">Попробуй расслабить взгляд и посмотреть чуть «сквозь» изображение. Не торопись — иногда скрытая глубина появляется не сразу. Здесь нет правильных ответов: просто разглядывай и наслаждайся загадкой.</p><div class="grid">
<figure class="tile" tabindex="0" role="button" aria-label="Увеличить стереокартинку"><img src="assets/stereo-1.png" alt="Стереокартинка для рассматривания"></figure>
<figure class="tile" tabindex="0" role="button" aria-label="Увеличить стереокартинку"><img src="assets/stereo-2.jpg" alt="Стереокартинка для рассматривания"></figure>
<figure class="tile" tabindex="0" role="button" aria-label="Увеличить стереокартинку"><img src="assets/stereo-3.jpg" alt="Стереокартинка для рассматривания"></figure>
<figure class="tile" tabindex="0" role="button" aria-label="Увеличить стереокартинку"><img src="assets/stereo-4.jpg" alt="Стереокартинка для рассматривания"></figure>
</div></main><div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Увеличенная стереокартинка"><button class="close" id="close" aria-label="Закрыть">×</button><img id="large" alt="Увеличенная стереокартинка"></div><script>
const viewer=document.getElementById('viewer'),large=document.getElementById('large');
function openTile(tile){large.src=tile.querySelector('img').src;viewer.classList.add('open');}
document.querySelectorAll('.tile').forEach(tile=>{tile.addEventListener('click',()=>openTile(tile));tile.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openTile(tile)}})});
function closeViewer(){viewer.classList.remove('open');large.removeAttribute('src')}
document.getElementById('close').addEventListener('click',closeViewer);viewer.addEventListener('click',e=>{if(e.target===viewer)closeViewer()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeViewer()});
</script></body></html>
