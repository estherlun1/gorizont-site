<style>

.wardrobe-footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:13px;position:relative}.wardrobe-hint{font:13px/1.35 Arial;color:#805b37}.footer-buttons{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.result{width:min(600px,96vw);margin:auto;padding:22px;background:#fff0d8ee;border:3px solid #c88d4a;border-radius:24px;text-align:center;box-shadow:0 12px 35px #1e130b66}.result h2{font-size:30px;margin:0 0 6px}.result p{font:15px Arial}.result-stage{height:380px;display:flex;align-items:flex-end;justify-content:center}#finalDoll{height:100%;filter:drop-shadow(0 7px 5px #26170f66)}
.hidden{display:none!important}
@media(max-width:950px){.layout{grid-template-columns:minmax(250px,38%) minmax(0,62%);gap:10px}.character-stage{height:53vh;min-height:360px}.items-grid{grid-template-columns:repeat(3,minmax(0,1fr));max-height:43vh}.item{min-height:105px}.item img{height:90px}.wardrobe{padding:12px}}
@media(max-width:700px){body{background-attachment:scroll}.game-shell{padding:9px}.brand{font-size:10px;padding:7px}.game-title h1{font-size:22px}.game-title p{font-size:11px}.layout{grid-template-columns:1fr;gap:10px}.hero-column{padding-left:74px}.character-switch{left:0;top:20%;gap:7px}.character-chip{width:66px;height:78px}.character-chip canvas{height:56px}.character-stage{height:390px;min-height:0}.hero-label{font-size:17px}.wardrobe{width:100%}.items-grid{max-height:340px}.wardrobe-footer{align-items:flex-start;flex-direction:column}.footer-buttons{width:100%}.footer-buttons button{flex:1}}
@media(max-width:420px){.character-option canvas{height:190px}.category-tab{min-height:58px}.category-tab .symbol{font-size:20px}.category-tab small{font-size:10px}.items-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}}

/* refined layout: clean scene, portrait tags and three-column wardrobe */
.topbar,.game-title,.brand{display:none!important}
.game-shell{min-height:100vh;padding:0 clamp(10px,1.5vw,26px)}
.layout{width:min(1600px,100%);min-height:100vh;grid-template-columns:minmax(390px,46%) minmax(560px,54%);gap:clamp(12px,2vw,28px);padding:24px 0;align-items:center}
.hero-column{transform:translateX(28px)}
.character-stage{height:min(84vh,790px);min-height:470px}
#doll{height:100%;filter:drop-shadow(0 9px 7px #26170f66)}
.character-switch{left:0;top:30%;gap:12px}
.character-chip{width:86px;height:92px;padding:3px 4px 2px;border:2px solid #d9aa70;border-radius:17px;background:rgba(255,239,211,.92);box-shadow:0 4px 12px #29190f55;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.character-chip canvas{width:74px;height:70px;object-fit:contain}
.character-chip span{font:12px Georgia,serif;color:#704322;font-weight:bold;line-height:15px}
.character-chip.active{background:rgba(73,61,43,.82);border-color:#f5d39b;box-shadow:0 0 0 2px #fff0d1,0 5px 13px #21150e77}

.category-tabs{display:flex;gap:8px;align-items:flex-end;margin-bottom:12px}
.category-tab{flex:1;min-width:0;min-height:58px;padding:6px 4px 8px;border-radius:16px 16px 5px 5px;border:2px solid #c68d4d;border-bottom:4px solid #a46d37;background:linear-gradient(#fff4df,#e9c995);box-shadow:none}

@media(max-width:950px){

.site-back{position:fixed;left:22px;top:20px;z-index:20;display:inline-flex;align-items:center;gap:7px;padding:10px 17px;border:2px solid #87502a;border-radius:14px;background:linear-gradient(#f8e2b9,#d8a15d);color:#714321;text-decoration:none;font:bold 14px Georgia,serif;box-shadow:0 4px 0 #704322,0 5px 12px #21160955}
.site-back:hover{filter:brightness(1.06);transform:translateY(-1px)}

.character-chip{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:0;padding:3px 4px 2px}

</style></head><body><a class="site-back" href="../index.html" aria-label="Вернуться на сайт">← На сайт</a><main class="game-shell">

<div class="layout" id="game"><section class="hero-column">
<div class="character-switch">
<button class="character-chip active" data-switch="mila" title="Мила"><canvas id="milaChip" width="292" height="292"></canvas><span>Мила</span></button>
<button class="character-chip" data-switch="misha" title="Миша"><canvas id="mishaChip" width="292" height="292"></canvas><span>Миша</span></button>
</div>
<div class="character-stage"><canvas id="doll" width="292" height="724"></canvas></div>
</section>
<section class="wardrobe"><div class="wardrobe-heading"><h2>Гардероб</h2><span>Выбери детали образа</span></div>
<div class="category-tabs"><button class="category-tab active" data-kind="shirts"><span class="symbol">👕</span><small>Футболки</small></button><button class="category-tab" data-kind="hoodies"><span class="symbol">🧥</span><small>Толстовки</small></button><button class="category-tab" data-kind="pants"><span class="symbol">👖</span><small>Брюки</small></button><button class="category-tab" data-kind="shoes"><span class="symbol">👟</span><small>Обувь</small></button></div>
<div class="items-wrap"><div class="items-grid" id="items"></div></div><div class="wardrobe-footer"><div class="wardrobe-hint" id="hint">Нажимай на вещи, чтобы примерить их на героя.</div><div class="footer-buttons"><button class="wood-button" id="randomLook">Случайный образ</button><button class="wood-button green" id="finish">Готово ✓</button></div></div></section></div>
<section class="result hidden" id="result"><h2>🌲 Образ готов!</h2><p>Герой готов к новым приключениям.</p><div class="result-stage"><canvas id="finalDoll" width="292" height="724"></canvas></div><button class="wood-button" id="again">Собрать ещё один образ</button></section></main>
<script>
const DATA={bases:{mila:'base.png',misha:'misha_base.png'},pants:Array.from({length:6},(_,i)=>'pants_'+(i+1)+'.png'),shoes:Array.from({length:10},(_,i)=>'shoe_'+(i+1)+'.png'),shirts:Array.from({length:12},(_,i)=>'shirt_'+(i+1)+'.png'),hoodies:Array.from({length:12},(_,i)=>'hoodie_'+(i+1)+'.png'),shirtHeads:{mila:'shirt_head.png',misha:'misha_shirt_head.png'},hoodieHeads:{mila:[...Array.from({length:11},(_,i)=>'hoodie_head_'+(i+1)+'.png'),'mila_hoodie_head_12.png'],misha:Array.from({length:12},(_,i)=>'misha_hoodie_head_'+(i+1)+'.png')}};
const A='assets/',cache={};let selectedCharacter='mila',kind='shirts',chosen={top:null,topKind:null,pants:null,shoes:null};
function image(file){if(!cache[file]){const im=new Image();im.src=A+file;cache[file]=im;im.onload=draw}return cache[file]}
function drawTo(c){const x=c.getContext('2d');x.clearRect(0,0,292,724);const put=f=>{const im=image(f);if(im.complete&&im.naturalWidth)x.drawImage(im,0,0,292,724)};put(DATA.bases[selectedCharacter]);if(chosen.shoes!==null)put(DATA.shoes[chosen.shoes]);if(chosen.pants!==null)put(DATA.pants[chosen.pants]);if(chosen.top!==null){put((chosen.topKind==='hoodies'?DATA.hoodies:DATA.shirts)[chosen.top]);put(chosen.topKind==='hoodies'?DATA.hoodieHeads[selectedCharacter][chosen.top]:DATA.shirtHeads[selectedCharacter])}}
function draw(){drawTo(document.getElementById('doll'));if(!document.getElementById('result').classList.contains('hidden'))drawTo(document.getElementById('finalDoll'))}
function portrait(id,ch){const c=document.getElementById(id),ctx=c.getContext('2d'),im=new Image();im.onload=()=>{const temp=document.createElement('canvas');temp.width=292;temp.height=724;const t=temp.getContext('2d');t.drawImage(im,0,0,292,724);ctx.clearRect(0,0,292,292);ctx.drawImage(temp,45,0,202,225,0,0,292,292)};im.src=A+DATA.bases[ch]}
function setCharacter(ch){selectedCharacter=ch;document.querySelectorAll('[data-switch]').forEach(b=>b.classList.toggle('active',b.dataset.switch===ch));draw();renderItems()}
function showGame(ch){setCharacter(ch);document.getElementById('result').classList.add('hidden');document.getElementById('game').classList.remove('hidden')}
function renderItems(){const box=document.getElementById('items');box.innerHTML='';DATA[kind].forEach((file,i)=>{const b=document.createElement('button');b.className='item';const selected=kind==='shirts'?chosen.top===i&&chosen.topKind==='shirts':kind==='hoodies'?chosen.top===i&&chosen.topKind==='hoodies':kind==='pants'?chosen.pants===i:chosen.shoes===i;if(selected)b.classList.add('selected');const im=document.createElement('img');im.src=A+file.replace('.png','_thumb.png');im.alt='Вариант одежды';b.append(im);b.onclick=()=>{if(kind==='shirts'||kind==='hoodies'){chosen.top=i;chosen.topKind=kind}else if(kind==='pants')chosen.pants=i;else chosen.shoes=i;renderItems();draw()};box.append(b)});document.querySelectorAll('[data-kind]').forEach(b=>b.classList.toggle('active',b.dataset.kind===kind));document.getElementById('hint').textContent={shirts:'Выбери футболку для своего героя.',hoodies:'Подбери уютную толстовку.',pants:'Выбери брюки или джинсы.',shoes:'Заверши образ подходящей обувью.'}[kind]}
document.querySelectorAll('[data-character]').forEach(b=>b.onclick=()=>showGame(b.dataset.character));document.querySelectorAll('[data-switch]').forEach(b=>b.onclick=()=>setCharacter(b.dataset.switch));document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;renderItems()});

document.getElementById('randomLook').onclick=()=>{const r=n=>Math.floor(Math.random()*n);chosen.topKind=Math.random()<.5?'shirts':'hoodies';chosen.top=r(12);chosen.pants=r(6);chosen.shoes=r(10);kind=chosen.topKind;renderItems();draw()};
document.getElementById('finish').onclick=()=>{document.getElementById('game').classList.add('hidden');document.getElementById('result').classList.remove('hidden');draw()};
document.getElementById('again').onclick=()=>{chosen={top:null,topKind:null,pants:null,shoes:null};kind='shirts';document.getElementById('result').classList.add('hidden');document.getElementById('game').classList.remove('hidden');renderItems();draw()};
document.getElementById('backToSite').onclick=()=>{if(history.length>1)history.back();else location.href='../index.html'};
portrait('milaChip','mila');portrait('mishaChip','misha');
[...DATA.pants,...DATA.shoes,...DATA.shirts,...DATA.hoodies,Object.values(DATA.bases),Object.values(DATA.shirtHeads),...Object.values(DATA.hoodieHeads)].flat().forEach(image);renderItems();draw();
</script></body></html>
