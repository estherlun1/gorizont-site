name: Export PNG images as WebP
on:
  push:
    paths:
      - ".github/workflows/export-webp.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Convert PNG files only
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import zipfile
          root = Path(".")
          out = Path("png-to-webp")
          out.mkdir(exist_ok=True)
          converted = 0
          for p in root.rglob("*.png"):
              if ".git" in p.parts or "png-to-webp" in p.parts:
                  continue
              rel = p.relative_to(root)
              dest = (out / rel).with_suffix(".webp")
              dest.parent.mkdir(parents=True, exist_ok=True)
              with Image.open(p) as im:
                  # Keep transparency and full image dimensions.
                  im.save(dest, "WEBP", lossless=True, method=6)
              converted += 1
          (out / "README.txt").write_text(
              "Конвертация только исходных PNG-файлов сайта Горизонт в WebP.\\n"
              "Сохранена структура папок. Изображения записаны без потерь (lossless), прозрачность сохранена.\\n"
              "Исходные PNG и файлы сайта не изменялись.\\n"
              f"Конвертировано PNG: {converted}.\\n",
              encoding="utf-8"
          )
          with zipfile.ZipFile("gorizont-png-to-webp.zip", "w", zipfile.ZIP_DEFLATED) as z:
              for f in out.rglob("*"):
                  if f.is_file():
                      z.write(f, f.relative_to(out))
          print(f"Converted {converted} PNG files.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gorizont-png-to-webp
          path: gorizont-png-to-webp.zip
          retention-days: 7
