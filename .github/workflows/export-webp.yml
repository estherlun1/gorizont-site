name: Convert site PNG assets to WebP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert-and-replace:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Convert images and update references
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re

          root = Path(".")
          pngs = sorted(
              p for p in root.rglob("*")
              if p.is_file()
              and p.suffix.lower() == ".png"
              and ".git" not in p.parts
          )
          if not pngs:
              raise SystemExit("No PNG files found; nothing to convert.")

          converted = []
          for source in pngs:
              target = source.with_suffix(".webp")
              target.parent.mkdir(parents=True, exist_ok=True)
              with Image.open(source) as image:
                  image.save(target, "WEBP", lossless=True, method=6)
              converted.append((source, target))

          # Update references in site/source text files. Match the extension
          # only, preserving query strings, fragments, quotes and URL paths.
          text_exts = {
              ".html", ".htm", ".css", ".js", ".mjs", ".cjs",
              ".json", ".svg", ".xml", ".md", ".txt"
          }
          updated_files = 0
          for file in root.rglob("*"):
              if not file.is_file() or ".git" in file.parts:
                  continue
              if file.parts[:2] == (".github", "workflows"):
                  continue
              if file.suffix.lower() not in text_exts:
                  continue
              try:
                  original = file.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              revised = re.sub(r"(?i)\\.png", ".webp", original)
              if revised != original:
                  file.write_text(revised, encoding="utf-8")
                  updated_files += 1

          # Remove originals only after all conversions and reference updates succeeded.
          for source, _ in converted:
              source.unlink()

          # Fail safely if any PNGs remain in the repository.
          remaining = [
              str(p) for p in root.rglob("*")
              if p.is_file() and p.suffix.lower() == ".png" and ".git" not in p.parts
          ]
          if remaining:
              raise SystemExit("PNG files remain: " + ", ".join(remaining))

          print(f"Converted and replaced {len(converted)} PNG files.")
          print(f"Updated references in {updated_files} text files.")
          PY

      - name: Commit converted assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Convert PNG assets to lossless WebP"
            git push
          fi
